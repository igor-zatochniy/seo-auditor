name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      freeze_evidence:
        description: Run repeated concurrency checks before freeze
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backup-windows:
    name: Windows backup checks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test private files and encrypted backup
        shell: pwsh
        run: |
          ./run-audit_test.ps1
          ./start-auditor_test.ps1
          ./database-backup_test.ps1
      - name: Test Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          ./run-audit_test.ps1
          ./start-auditor_test.ps1
          ./database-backup_test.ps1

  verify:
    name: Go checks and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_USER: seo_user
      DB_PASSWORD: integration-only-password
      DB_NAME: seo_db
      DB_PORT: "5432"
      DATABASE_URL: postgres://seo_user:integration-only-password@127.0.0.1:5432/seo_db?sslmode=disable
      TARGET_FINGERPRINT_KEY: local-development-only-fingerprint-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Test Windows report launcher
        shell: pwsh
        run: |
          ./run-audit_test.ps1
          ./start-auditor_test.ps1

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Test browser interface behavior
        run: node --test web/tests/*.test.cjs

      - name: Stress test shuffled execution
        if: github.event_name == 'workflow_dispatch' && inputs.freeze_evidence
        shell: bash
        run: |
          go test -v -shuffle=on -count=10 ./... | tee "$RUNNER_TEMP/freeze-shuffle.log"
          go test -v -race -shuffle=on -count=10 ./... | tee "$RUNNER_TEMP/freeze-race.log"

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
          cache-key: go-1.26

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: ${{ steps.go.outputs.go-version }}
          check-latest: false
          go-package: ./...
          repo-checkout: false

      - name: Build Docker image
        run: docker build --pull --tag seo-auditor:ci .

      - name: Scan Docker image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --format table --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --skip-version-check seo-auditor:ci

      - name: Build PostgreSQL Docker image
        run: docker build --pull --file Dockerfile.postgres --tag seo-auditor-postgres:ci .

      - name: Verify PostgreSQL version
        run: >-
          docker run --rm seo-auditor-postgres:ci sh -ec
          'test "$(postgres --version)" = "postgres (PostgreSQL) 16.15"'

      - name: Scan PostgreSQL Docker image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --format table --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --skip-version-check seo-auditor-postgres:ci

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: seo-auditor:ci
          artifact-name: seo-auditor.spdx.json
          output-file: ./seo-auditor.spdx.json

      - name: Build egress firewall image
        run: docker build --pull --file Dockerfile.egress --tag seo-auditor-egress:local .

      - name: Scan egress firewall image
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --skip-version-check seo-auditor-egress:local

      - name: Start integration PostgreSQL
        run: |
          docker tag seo-auditor-postgres:ci seo-auditor-postgres:local
          docker compose -f docker-compose.yml -f docker-compose.db-access.yml up --no-build --pull never --wait postgres

      - name: Run integration tests
        run: go test -tags=integration -count=1 ./...

      - name: Verify network egress firewall
        run: |
          docker compose -f docker-compose.yml -f docker-compose.db-access.yml up --no-build --pull never --wait egress-guard
          sh deploy/test-egress.sh

      - name: Start isolated rendering browser
        run: docker compose -p render-tests -f docker-compose.render-test.yml up -d --build --wait

      - name: Verify rendering through Compose service DNS
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/render.test" ./internal/render
          chmod 755 "$RUNNER_TEMP/render.test"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network render-tests_render-isolated \
            --env RENDER_TEST_BROWSER_URL=http://browser:9222 \
            --volume "$RUNNER_TEMP/render.test:/tmp/render.test:ro" \
            --entrypoint /tmp/render.test seo-auditor:ci \
            -test.v -test.run '^TestBrowserUsesCapturedHTMLAndBroker$'

      - name: Test JavaScript rendering and persistence
        env:
          RENDER_TEST_BROWSER_URL: http://127.0.0.1:9224
        run: go test -p 1 -race -tags=integration -run 'TestRendering|TestBrowser|TestLab|TestMalformedDebugger|TestRenderComparison|TestComparison' -count=1 ./...

      - name: Scan rendering browser image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436
          image --format table --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --skip-version-check --timeout 15m seo-auditor-browser:local

      - name: Stop rendering test browser
        if: always()
        run: docker compose -p render-tests -f docker-compose.render-test.yml down

      - name: Stress test PostgreSQL ownership and shutdown
        if: github.event_name == 'workflow_dispatch' && inputs.freeze_evidence
        shell: bash
        env:
          STRESS_TESTS: >-
            ^Test(AuditRunClaimsAreExclusiveAndResumable|ResumeWaitsForLockedResumableTarget|RepeatedWorkerIDCannotPersistAfterOwnershipTakeover|HeartbeatMonitorCancelsWorkAfterOwnershipLoss|FailedAuditRunPreservesTargetForResume|CanceledCompletionWaitsForPostgreSQLTargetLock|StaleRecoveryDefersLockedTargetUntilNextPass|AbandonStaleAuditRunsUsesPostgreSQLClock|CancellationWaitsForAllResultProducers)$
        run: |
          go test -v -tags=integration -race -shuffle=on -count=10 \
            -run "$STRESS_TESTS" ./... | tee "$RUNNER_TEMP/freeze-postgres.log"

      - name: Stop integration PostgreSQL
        if: always()
        run: docker compose down --volumes
