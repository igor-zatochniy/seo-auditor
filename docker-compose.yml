services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: seo-auditor-postgres:local
    container_name: seo_auditor_postgres
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    networks:
      - seo-network

  parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: seo-auditor:local
    container_name: seo_auditor_parser
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_ID: ${RUN_ID:-}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-}
      TARGET_FINGERPRINT_KEY: ${TARGET_FINGERPRINT_KEY:?TARGET_FINGERPRINT_KEY is required}
      TARGET_FINGERPRINT_KEY_ID: ${TARGET_FINGERPRINT_KEY_ID:-default}
      WORKERS: ${WORKERS:-3}
      GOMEMLIMIT: ${GOMEMLIMIT:-192MiB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HTTP_ATTEMPT_TIMEOUT: ${HTTP_ATTEMPT_TIMEOUT:-5s}
      HTTP_TOTAL_TIMEOUT: ${HTTP_TOTAL_TIMEOUT:-20s}
      ROBOTS_ATTEMPT_TIMEOUT: ${ROBOTS_ATTEMPT_TIMEOUT:-3s}
      ROBOTS_TOTAL_TIMEOUT: ${ROBOTS_TOTAL_TIMEOUT:-10s}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_MIGRATION_TIMEOUT: ${DB_MIGRATION_TIMEOUT:-30s}
      DB_FETCH_TIMEOUT: ${DB_FETCH_TIMEOUT:-5s}
      DB_WRITE_TIMEOUT: ${DB_WRITE_TIMEOUT:-3s}
      REPORT_EXPORT_TIMEOUT: ${REPORT_EXPORT_TIMEOUT:-2m}
      REPORT_RETENTION_COUNT: ${REPORT_RETENTION_COUNT:-100}
      AUDIT_RUN_HEARTBEAT_INTERVAL: ${AUDIT_RUN_HEARTBEAT_INTERVAL:-30s}
      HEARTBEAT_FAILURE_THRESHOLD: ${HEARTBEAT_FAILURE_THRESHOLD:-3}
      STALE_RUN_THRESHOLD: ${STALE_RUN_THRESHOLD:-5m}
      TARGET_LEASE_DURATION: ${TARGET_LEASE_DURATION:-2m}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-25s}
      FINALIZATION_TIMEOUT: ${FINALIZATION_TIMEOUT:-30s}
      STOP_GRACE_PERIOD: ${STOP_GRACE_PERIOD:-65s}
      URL_BATCH_SIZE: ${URL_BATCH_SIZE:-100}
      MAX_HTML_BODY_BYTES: ${MAX_HTML_BODY_BYTES:-5242880}
      MAX_HTML_TOKEN_BYTES: ${MAX_HTML_TOKEN_BYTES:-524288}
      RATE_LIMIT_INTERVAL: ${RATE_LIMIT_INTERVAL:-500ms}
      MAX_CONCURRENT_PER_HOST: ${MAX_CONCURRENT_PER_HOST:-1}
      ROBOTS_CACHE_TTL: ${ROBOTS_CACHE_TTL:-1h}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-2}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-2}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-200ms}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-2s}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    volumes:
      - reports:/app/reports
    mem_limit: 256m
    cpus: 0.50
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${STOP_GRACE_PERIOD:-65s}
    networks:
      - seo-network

volumes:
  pgdata:
  reports:

networks:
  seo-network:
    driver: bridge
